name: Daily VayboMeter (Cyprus)

on:
  schedule:
    # Утренний пост: 01:00 UTC ≈ 04:00 на Кипре летом / 03:00 зимой
    - cron: '0 1 * * *'
    # Recovery утреннего поста, если primary schedule/job не стартовал на runner
    - cron: '15 3 * * *'
    # Вечерний пост: 13:00 UTC ≈ 16:00 на Кипре летом / 15:00 зимой
    - cron: '0 13 * * *'
    # Курсы валют: 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      run_morning:
        description: "Запустить утренний пост"
        type: boolean
        default: false
        required: false
      run_evening:
        description: "Запустить вечерний пост"
        type: boolean
        default: true
        required: false
      run_noon_fx:
        description: "Запустить пост только с курсами"
        type: boolean
        default: false
        required: false
      format_v2:
        description: "FORMAT_V2 для ручного теста/override; расписание morning/evening уже включает V2"
        type: boolean
        default: true
        required: false
      publish_to_prod:
        description: "Публиковать в основной канал?"
        type: boolean
        default: false
        required: false
      work_date:
        description: "Переопределить дату (YYYY-MM-DD)"
        required: false
      to_test:
        description: "Публиковать в тестовый канал?"
        type: boolean
        default: false
        required: false
      channel_override:
        description: "Явный chat_id канала (перебивает параметры выше)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-post-cy
  cancel-in-progress: false

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHANNEL_ID:          ${{ secrets.CHANNEL_ID }}
  CHANNEL_ID_TEST:     ${{ secrets.CHANNEL_ID_TEST }}
  CHANNEL_ID_OVERRIDE: ${{ github.event.inputs.channel_override || '' }}

  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL: "openai/gpt-oss-120b"
  GROQ_FALLBACK_MODEL: "openai/gpt-oss-20b"
  POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
  STABLE_HORDE_API_KEY: ${{ secrets.STABLE_HORDE_API_KEY }}
  CUSTOM_IMAGE_API_KEY: ${{ secrets.CUSTOM_IMAGE_API_KEY }}
  CY_IMG_MIN_BYTES: "12000"

  GEN_SKIP_SHORT: "1"
  DISABLE_LLM_DAILY: "0"
  DISABLE_SCHUMANN: "1"
  FORMAT_V2: ${{ github.event.inputs.format_v2 == 'true' && '1' || '0' }}
  FORMAT_V2_MORNING_SPACING: "1"
  MORNING_FEELS_LIKE: "1"
  MORNING_BEST_WINDOW: "1"
  MORNING_SMART_PLAN: "1"
  MORNING_VAYBOMETER_SCORE: "1"
  EVENING_VAYBOMETER_SCORE: "1"
  FORMAT_V2_POLISH: "1"
  FORMAT_V2_SCORE_CONCLUSION: "1"
  FORMAT_V2_REASON_CONCLUSION: "1"
  FORMAT_V2_MAIN_NUANCE: "1"
  FORMAT_V2_ASTRO_CLEANUP: "1"
  FORMAT_V2_CONFIDENCE_POLISH: "1"
  CY_AIR_BY_CITY: "1"
  CY_QUAKES_24H: "1"
  CY_QUAKE_HOURS: "24"
  CY_QUAKE_RADIUS_KM: "350"
  CY_QUAKE_MIN_MAG: "0.9"

  TZ: Asia/Nicosia
  GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
  WORK_DATE: ${{ github.event.inputs.work_date || '' }}
  TO_TEST:   ${{ github.event.inputs.to_test || 'false' }}
  PUBLISH_TO_PROD: ${{ github.event.inputs.publish_to_prod || 'false' }}

  # Постоянная папка кэша (fx_cache.json / fx_inter_cache.json и др.)
  VAYBOMETER_CACHE_DIR: ".cache"
  CYPRUS_VISUAL_HISTORY_PATH: ".cache/cyprus_visual_history_prod.json"
  CYPRUS_VISUAL_HISTORY_PROD_PATH: ".cache/cyprus_visual_history_prod.json"
  CYPRUS_VISUAL_HISTORY_TEST_PATH: ".cache/cyprus_visual_history_test.json"
  CY_MORNING_DELIVERY_DIR: ".cache/cy_morning_delivery"

  # Утренние картинки: 5 стилей, авто-ротация по дате
  CY_IMG_ENABLED: "1"
  CY_MORNING_STYLE: "auto"          # можно: auto | 1 | 2 | 3 | 4 | 5
  CY_MORNING_SEED_OFFSET: "0"
  CY_MORNING_ASPECT: "1:1"

jobs:
  morning:
    name: Morning post (for today)
    runs-on: ubuntu-latest
    if: >
      (
        github.event_name == 'schedule' &&
        (github.event.schedule == '0 1 * * *' || github.event.schedule == '15 3 * * *')
      ) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_morning == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Restore .cache (FX + intermarket deltas)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            !.cache/cyprus_visual_history_prod.json
            !.cache/cyprus_visual_history_test.json
            !.cache/cy_morning_delivery
          key: cy-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            cy-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Restore Cyprus visual history (prod)
        id: cyprus-visual-history-prod-cache
        uses: actions/cache@v4
        with:
          path: .cache/cyprus_visual_history_prod.json
          key: cyprus-visual-history-prod-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            cyprus-visual-history-prod-

      - name: Restore Cyprus visual history (test)
        id: cyprus-visual-history-test-cache
        uses: actions/cache@v4
        with:
          path: .cache/cyprus_visual_history_test.json
          key: cyprus-visual-history-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            cyprus-visual-history-test-

      - name: Inspect Cyprus visual history
        shell: bash
        run: |
          mkdir -p .cache
          echo "Cyprus visual history prod exact-key hit: ${{ steps.cyprus-visual-history-prod-cache.outputs.cache-hit }}"
          echo "Cyprus visual history test exact-key hit: ${{ steps.cyprus-visual-history-test-cache.outputs.cache-hit }}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          for label, env_name in (
              ("prod", "CYPRUS_VISUAL_HISTORY_PROD_PATH"),
              ("test", "CYPRUS_VISUAL_HISTORY_TEST_PATH"),
          ):
              path = Path(os.environ[env_name])
              try:
                  data = json.loads(path.read_text("utf-8"))
                  count = len(data) if isinstance(data, list) else 0
              except Exception as exc:
                  print(f"Cyprus visual history {label} read issue before generation: {exc}")
                  count = 0
              print(f"Cyprus visual history {label} path: {path}")
              print(f"Cyprus visual history {label} entries before generation: {count}")
          PY

      - name: Restore Cyprus morning delivery receipts
        id: cyprus-morning-delivery-cache
        uses: actions/cache@v4
        with:
          path: .cache/cy_morning_delivery
          key: cyprus-morning-delivery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            cyprus-morning-delivery-

      - name: Inspect Cyprus morning delivery receipts
        shell: bash
        run: |
          mkdir -p .cache/cy_morning_delivery
          echo "Cyprus morning delivery cache exact-key hit: ${{ steps.cyprus-morning-delivery-cache.outputs.cache-hit }}"
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def _target_date() -> str:
              wd = (os.getenv("WORK_DATE") or "").strip()
              if wd:
                  return wd[:10]
              return datetime.now(ZoneInfo(os.getenv("TZ", "Asia/Nicosia"))).date().isoformat()

          def _valid(data, target_date: str) -> bool:
              if not isinstance(data, dict):
                  return False
              if data.get("target_date") != target_date:
                  return False
              if data.get("chat_type") != "production":
                  return False
              message_ids = data.get("telegram_message_ids")
              if not isinstance(message_ids, list) or not message_ids:
                  return False
              chunk_count = data.get("text_chunk_count")
              if not isinstance(chunk_count, int) or chunk_count < 1:
                  return False
              if len(message_ids) < chunk_count:
                  return False
              sent_at = data.get("sent_at_utc")
              return isinstance(sent_at, str) and bool(sent_at.strip())

          target_date = _target_date()
          delivery_dir = Path(os.getenv("CY_MORNING_DELIVERY_DIR", ".cache/cy_morning_delivery"))
          files = sorted(path.name for path in delivery_dir.glob("*.json"))
          receipt_path = delivery_dir / f"{target_date}.json"
          try:
              data = json.loads(receipt_path.read_text("utf-8"))
          except FileNotFoundError:
              data = None
          except Exception as exc:
              print(f"Cyprus morning delivery receipt read issue: {exc.__class__.__name__}: {exc}")
              data = None
          print(f"Cyprus morning delivery target date: {target_date}")
          print(f"Cyprus morning delivery restored receipt files: {files}")
          print(f"Cyprus morning delivery valid production receipt exists: {_valid(data, target_date)}")
          PY

      - name: Time debug
        run: |
          echo "UTC:    $(date -u)"
          echo "Cyprus:  $(date)"
          echo "MSK:    $(TZ=Europe/Moscow date)"
          echo "FORMAT_V2: $FORMAT_V2"
          echo "event:   $GITHUB_EVENT_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "aiogram>=3,<4"

      - name: Post morning (for today)
        shell: bash
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import datetime as dt
          import json
          import os
          import runpy
          import sys
          import urllib.parse
          import urllib.request
          from safe_test_post import (
              cy_morning_delivery_path,
              cy_morning_has_valid_production_receipt,
              cy_morning_target_date,
          )

          def _gh_json(path):
              token = (os.getenv("GH_ACTIONS_TOKEN") or "").strip()
              repo = (os.getenv("GITHUB_REPOSITORY") or "").strip()
              if not token or not repo:
                  return None
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          def _log_related_successful_jobs():
              if os.getenv("GITHUB_EVENT_NAME") != "schedule":
                  return
              today_utc = dt.datetime.now(dt.timezone.utc).date().isoformat()
              current_run_id = str(os.getenv("GITHUB_RUN_ID") or "")
              branch = urllib.parse.quote(os.getenv("GITHUB_REF_NAME") or "main", safe="")
              try:
                  runs = _gh_json(
                      f"/actions/workflows/daily_post.yml/runs?event=schedule&branch={branch}&per_page=30"
                  ) or {}
                  for run in runs.get("workflow_runs", []):
                      run_id = str(run.get("id") or "")
                      if not run_id or run_id == current_run_id:
                          continue
                      if str(run.get("created_at") or "")[:10] != today_utc:
                          continue
                      if run.get("conclusion") != "success":
                          continue
                      jobs = _gh_json(f"/actions/runs/{run_id}/jobs?per_page=100") or {}
                      for job in jobs.get("jobs", []):
                          if (
                              job.get("name") == "Morning post (for today)"
                              and job.get("conclusion") == "success"
                          ):
                              print(
                                  "CY_MORNING_GITHUB_SUCCESSFUL_JOB_SEEN: "
                                  f"run_id={run_id}; receipt still required for delivery skip"
                              )
              except Exception as exc:
                  print(f"CY_MORNING_GITHUB_JOB_LOG_CHECK_FAILED: {exc.__class__.__name__}: {exc}")

          scheduled_run = (os.getenv("GITHUB_EVENT_NAME") == "schedule")
          format_v2 = scheduled_run or (os.getenv("FORMAT_V2", "").strip().lower() in ("1", "true", "yes", "on"))
          to_test = (os.getenv("TO_TEST", "").strip().lower() in ("1", "true", "yes", "on"))
          publish_to_prod = (os.getenv("PUBLISH_TO_PROD", "").strip().lower() in ("1", "true", "yes", "on"))
          chat_override = (os.getenv("CHANNEL_ID_OVERRIDE") or "").strip()
          production_chat = (os.getenv("CHANNEL_ID") or "").strip()
          wd = (os.getenv("WORK_DATE") or "").strip()

          event_schedule = (os.getenv("GITHUB_EVENT_SCHEDULE") or "").strip()
          target_date = cy_morning_target_date(wd, os.getenv("TZ", "Asia/Nicosia"))
          if scheduled_run and event_schedule in ("0 1 * * *", "15 3 * * *"):
              receipt_path = cy_morning_delivery_path(target_date)
              print(f"CY_MORNING_DELIVERY_TARGET_DATE: {target_date}")
              print(f"CY_MORNING_DELIVERY_RECEIPT_PATH: {receipt_path}")
              if cy_morning_has_valid_production_receipt(target_date):
                  print(f"CY_MORNING_DELIVERY_SKIP: already delivered for {target_date}")
                  raise SystemExit(0)
              print(f"CY_MORNING_DELIVERY_SKIP: no valid receipt for {target_date}; continuing")
              _log_related_successful_jobs()

          if format_v2:
              args = ["safe_test_post.py", "--mode", "morning", "--format-v2"]
              if wd:
                  args += ["--date", wd]
              if chat_override:
                  args += ["--chat-id", chat_override, "--send", "--no-test-label", "--generate-image", "--send-image-to-chat"]
              elif to_test:
                  args += ["--to-test", "--send", "--generate-image", "--send-image-to-test"]
              elif scheduled_run and production_chat:
                  args += ["--chat-id", production_chat, "--send", "--no-test-label", "--generate-image", "--send-image-to-chat"]
              elif publish_to_prod:
                  if not production_chat:
                      raise SystemExit("PUBLISH_TO_PROD=1, но CHANNEL_ID не определён")
                  args += ["--chat-id", production_chat, "--send", "--no-test-label", "--generate-image", "--send-image-to-chat"]
              else:
                  print("FORMAT_V2 включён без to_test/publish_to_prod/channel_override: выполняю dry-run без отправки.")
              sys.argv = args
              runpy.run_path("safe_test_post.py", run_name="__main__")
              raise SystemExit(0)

          args = ["post_cy.py", "--mode", "morning"]
          if wd:
              args += ["--date", wd]
          if chat_override:
              args += ["--chat-id", chat_override]
          elif to_test:
              args.append("--to-test")
          elif publish_to_prod:
              if not production_chat:
                  raise SystemExit("PUBLISH_TO_PROD=1, но CHANNEL_ID не определён")
              args += ["--chat-id", production_chat]
          sys.argv = args
          runpy.run_path("post_cy.py", run_name="__main__")
          PY

      - name: Upload Cyprus morning diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cyprus-morning-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/cy_morning_diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  evening:
    name: Evening post (for tomorrow)
    runs-on: ubuntu-latest
    needs: morning
    if: >
      always() &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_evening == 'true')
      )
    steps:
      - uses: actions/checkout@v4

      - name: Restore .cache (FX + intermarket deltas)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            !.cache/cyprus_visual_history_prod.json
            !.cache/cyprus_visual_history_test.json
            !.cache/cy_morning_delivery
          key: cy-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            cy-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Restore Cyprus visual history (prod)
        id: cyprus-visual-history-prod-cache
        uses: actions/cache@v4
        with:
          path: .cache/cyprus_visual_history_prod.json
          key: cyprus-visual-history-prod-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            cyprus-visual-history-prod-

      - name: Restore Cyprus visual history (test)
        id: cyprus-visual-history-test-cache
        uses: actions/cache@v4
        with:
          path: .cache/cyprus_visual_history_test.json
          key: cyprus-visual-history-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            cyprus-visual-history-test-

      - name: Inspect Cyprus visual history
        shell: bash
        run: |
          mkdir -p .cache
          echo "Cyprus visual history prod exact-key hit: ${{ steps.cyprus-visual-history-prod-cache.outputs.cache-hit }}"
          echo "Cyprus visual history test exact-key hit: ${{ steps.cyprus-visual-history-test-cache.outputs.cache-hit }}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          for label, env_name in (
              ("prod", "CYPRUS_VISUAL_HISTORY_PROD_PATH"),
              ("test", "CYPRUS_VISUAL_HISTORY_TEST_PATH"),
          ):
              path = Path(os.environ[env_name])
              try:
                  data = json.loads(path.read_text("utf-8"))
                  count = len(data) if isinstance(data, list) else 0
              except Exception as exc:
                  print(f"Cyprus visual history {label} read issue before generation: {exc}")
                  count = 0
              print(f"Cyprus visual history {label} path: {path}")
              print(f"Cyprus visual history {label} entries before generation: {count}")
          PY

      - name: Time debug
        run: |
          echo "UTC:    $(date -u)"
          echo "Cyprus:  $(date)"
          echo "MSK:    $(TZ=Europe/Moscow date)"
          echo "FORMAT_V2: $FORMAT_V2"
          echo "event:   $GITHUB_EVENT_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "aiogram>=3,<4"

      - name: Post evening (announce tomorrow)
        shell: bash
        run: |
          python <<'PY'
          import os, runpy, sys

          scheduled_run = (os.getenv("GITHUB_EVENT_NAME") == "schedule")
          format_v2 = scheduled_run or (os.getenv("FORMAT_V2", "").strip().lower() in ("1", "true", "yes", "on"))
          to_test = (os.getenv("TO_TEST","").strip().lower() in ("1","true","yes","on"))
          publish_to_prod = (os.getenv("PUBLISH_TO_PROD", "").strip().lower() in ("1", "true", "yes", "on"))
          chat_override = (os.getenv("CHANNEL_ID_OVERRIDE") or "").strip()
          production_chat = (os.getenv("CHANNEL_ID") or "").strip()
          wd = (os.getenv("WORK_DATE") or "").strip()

          if format_v2:
              args = ["safe_test_post.py", "--mode", "evening", "--format-v2"]
              if wd:
                  args += ["--date", wd]
              if chat_override:
                  args += ["--chat-id", chat_override, "--send", "--no-test-label", "--generate-image", "--send-image-to-chat"]
              elif to_test:
                  args += ["--to-test", "--send", "--generate-image", "--send-image-to-test"]
              elif scheduled_run and production_chat:
                  args += ["--chat-id", production_chat, "--send", "--no-test-label", "--generate-image", "--send-image-to-chat"]
              elif publish_to_prod:
                  if not production_chat:
                      raise SystemExit("PUBLISH_TO_PROD=1, но CHANNEL_ID не определён")
                  args += ["--chat-id", production_chat, "--send", "--no-test-label", "--generate-image", "--send-image-to-chat"]
              else:
                  print("FORMAT_V2 включён без to_test/publish_to_prod/channel_override: выполняю dry-run без отправки.")
              sys.argv = args
              runpy.run_path("safe_test_post.py", run_name="__main__")
              raise SystemExit(0)

          args = ["post_cy.py", "--mode", "evening"]

          if wd:
              args += ["--date", wd]

          if chat_override:
              args += ["--chat-id", chat_override]
          elif to_test:
              args.append("--to-test")
          elif publish_to_prod:
              if not production_chat:
                  raise SystemExit("PUBLISH_TO_PROD=1, но CHANNEL_ID не определён")
              args += ["--chat-id", production_chat]

          sys.argv = args
          runpy.run_path("post_cy.py", run_name="__main__")
          PY

  noon_fx:
    name: Noon FX only (12:00 MSK)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_noon_fx == 'true')
    env:
      FX_FORCE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restore .cache (FX + intermarket deltas)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            !.cache/cyprus_visual_history_prod.json
            !.cache/cyprus_visual_history_test.json
            !.cache/cy_morning_delivery
          key: cy-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            cy-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Time debug
        run: |
          echo "UTC:    $(date -u)"
          echo "Cyprus:  $(date)"
          echo "MSK:    $(TZ=Europe/Moscow date)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "aiogram>=3,<4"

      - name: Post FX Market Pulse only (12:00 MSK)
        shell: bash
        run: |
          python <<'PY'
          import os, runpy, sys

          args = ["post_cy_fx_market_pulse.py"]

          wd = (os.getenv("WORK_DATE") or "").strip()
          if wd:
              args += ["--date", wd]

          chat_override = (os.getenv("CHANNEL_ID_OVERRIDE") or "").strip()
          if chat_override:
              args += ["--chat-id", chat_override]
          else:
              to_test = (os.getenv("TO_TEST","").strip().lower() in ("1","true","yes","on"))
              publish_to_prod = (os.getenv("PUBLISH_TO_PROD", "").strip().lower() in ("1", "true", "yes", "on"))
              production_chat = (os.getenv("CHANNEL_ID") or "").strip()
              if to_test:
                  args.append("--to-test")
              elif publish_to_prod:
                  if not production_chat:
                      raise SystemExit("PUBLISH_TO_PROD=1, но CHANNEL_ID не определён")
                  args += ["--chat-id", production_chat]

          sys.argv = args
          runpy.run_path("post_cy_fx_market_pulse.py", run_name="__main__")
          PY
