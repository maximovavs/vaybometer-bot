name: Weekly VayboMeter Forecast

on:
  schedule:
    # 22:00 Asia/Nicosia: 19:00 UTC in summer, 20:00 UTC in winter.
    - cron: "0 19 * * 6"
    - cron: "0 20 * * 6"
    # One-time recovery trigger: 2026-07-05 14:00 Asia/Nicosia.
    # Protected by an explicit year/date guard; safe if the cron remains temporarily.
    - cron: "0 11 5 7 *"
  workflow_dispatch:
    inputs:
      date:
        description: "Week start date YYYY-MM-DD, empty = today"
        required: false
        default: ""
      send_to_test:
        description: "Publish weekly forecast to test channel?"
        type: boolean
        required: true
        default: true
      publish_to_prod:
        description: "Publish weekly forecast to production channel?"
        type: boolean
        required: true
        default: false
      channel_override:
        description: "Optional Telegram chat/channel override. If set, send only there."
        required: false
        default: ""
      dry_run:
        description: "Preview only, do not send to Telegram"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-vaybometer-forecast-cy
  cancel-in-progress: false

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  CHANNEL_ID_TEST: ${{ secrets.CHANNEL_ID_TEST }}
  CHANNEL_ID_OVERRIDE: ${{ github.event.inputs.channel_override }}
  WEEK_START_DATE: ${{ github.event.inputs.date }}
  SEND_TO_TEST: ${{ github.event.inputs.send_to_test }}
  PUBLISH_TO_PROD: ${{ github.event.inputs.publish_to_prod }}
  DRY_RUN: ${{ github.event.inputs.dry_run }}
  SCHEDULE_EXPR: ${{ github.event.schedule }}
  AIRVISUAL_KEY: ${{ secrets.AIRVISUAL_KEY }}
  OWM_KEY: ${{ secrets.OWM_KEY }}
  TZ: Asia/Nicosia
  VAYBOMETER_CACHE_DIR: ".cache"

jobs:
  weekly_forecast:
    name: Build / optionally publish weekly forecast
    runs-on: ubuntu-latest
    steps:
      - name: Schedule guard
        id: schedule_guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "recovery_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Weekly schedule expression: ${SCHEDULE_EXPR:-}"

          if [ "${SCHEDULE_EXPR:-}" = "0 11 5 7 *" ]; then
            local_date="$(TZ="$TZ" date +%F)"
            if [ "$local_date" = "2026-07-05" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "recovery_run=true" >> "$GITHUB_OUTPUT"
              echo "Accepted one-time Cyprus weekly recovery run."
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "recovery_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping expired one-time recovery cron."
            fi
            exit 0
          fi

          offset="$(TZ="$TZ" date +%z)"
          echo "Current Cyprus UTC offset: $offset"
          case "${SCHEDULE_EXPR:-}|$offset" in
            "0 19 * * 6|+0300"|"0 20 * * 6|+0200")
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "recovery_run=false" >> "$GITHUB_OUTPUT"
              echo "Scheduled weekly run accepted despite runner delay."
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "recovery_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping inactive seasonal weekly cron."
              ;;
          esac

      - name: Resolve scheduled weekly date
        id: weekly_date
        if: steps.schedule_guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "${{ steps.schedule_guard.outputs.recovery_run }}" = "true" ]; then
            echo "week_start=2026-07-06" >> "$GITHUB_OUTPUT"
            echo "Weekly forecast recovery target: production"
            echo "Scheduled weekly range starts Monday: 2026-07-06"
            echo "Recovery schedule requested for 2026-07-05 14:00 Asia/Nicosia"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            week_start="$(python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo(os.environ["TZ"])
          today = datetime.now(tz).date()
          days_since_saturday = (today.weekday() - 5) % 7
          scheduled_saturday = today - timedelta(days=days_since_saturday)
          week_start = scheduled_saturday + timedelta(days=2)
          print(week_start.isoformat())
          PY
          )"
            echo "week_start=$week_start" >> "$GITHUB_OUTPUT"
            echo "Scheduled weekly range starts Monday: $week_start"
          else
            echo "week_start=${WEEK_START_DATE:-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.schedule_guard.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.schedule_guard.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build preview / optionally send weekly forecast
        if: steps.schedule_guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            CHANNEL_ID_OVERRIDE=""
            WEEK_START_DATE="${{ steps.weekly_date.outputs.week_start }}"
            SEND_TO_TEST="false"
            PUBLISH_TO_PROD="true"
            DRY_RUN="false"
            if [ "${{ steps.schedule_guard.outputs.recovery_run }}" = "true" ]; then
              echo "Weekly forecast recovery target: production"
              echo "Scheduled weekly range starts Monday: $WEEK_START_DATE"
              echo "Recovery schedule requested for 2026-07-05 14:00 Asia/Nicosia"
            else
              echo "Weekly forecast target: scheduled production"
              echo "Scheduled weekly range starts Monday: $WEEK_START_DATE"
            fi
          fi

          args=("send_weekly_forecast.py")
          if [ -n "${WEEK_START_DATE:-}" ]; then
            args+=("--date" "$WEEK_START_DATE")
          fi

          echo "Weekly forecast preview:"
          python "${args[@]}" | tee weekly_forecast_preview.log

          intended=()
          if [ -n "${CHANNEL_ID_OVERRIDE:-}" ]; then
            intended+=("override $CHANNEL_ID_OVERRIDE")
          else
            if [ "${SEND_TO_TEST:-}" = "true" ]; then
              intended+=("test")
            fi
            if [ "${PUBLISH_TO_PROD:-}" = "true" ]; then
              intended+=("production")
            fi
          fi

          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "Weekly forecast target: dry-run"
            if [ "${#intended[@]}" -gt 0 ]; then
              printf 'Dry-run intended target: %s\n' "${intended[@]}"
            else
              echo "Dry-run intended target: none"
            fi
            exit 0
          fi

          targets=()
          labels=()

          add_target() {
            local label="$1"
            local chat_id="$2"
            if [ -z "$chat_id" ]; then
              echo "Telegram destination for $label is empty"
              exit 1
            fi
            for existing in "${targets[@]}"; do
              if [ "$existing" = "$chat_id" ]; then
                echo "Weekly forecast target: $label (same chat as earlier destination; skipping duplicate send)"
                return
              fi
            done
            targets+=("$chat_id")
            labels+=("$label")
          }

          if [ -n "${CHANNEL_ID_OVERRIDE:-}" ]; then
            add_target "override $CHANNEL_ID_OVERRIDE" "$CHANNEL_ID_OVERRIDE"
          else
            if [ "${SEND_TO_TEST:-}" = "true" ]; then
              add_target "test" "$CHANNEL_ID_TEST"
            fi
            if [ "${PUBLISH_TO_PROD:-}" = "true" ]; then
              add_target "production" "$CHANNEL_ID"
            fi
          fi

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No Telegram destination selected. Choose test, prod, or channel_override."
            exit 1
          fi

          for i in "${!targets[@]}"; do
            echo "Weekly forecast target: ${labels[$i]}"
            send_args=("${args[@]}" "--send" "--chat-id" "${targets[$i]}")
            python "${send_args[@]}"
          done
