name: world-weekly-en

on:
  schedule:
    - cron: "0 16 * * 0"   # Sun 16:00 UTC
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Куда отправить weekly report?"
        type: choice
        required: false
        default: telegram
        options:
          - telegram   # только основной Телеграм
          - test       # тестовый Телеграм
      send_to_test:
        type: boolean
        description: "(deprecated) Send to TEST channel instead of main"
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests jinja2 pytz astral

      - name: Collect weekly
        env:
          YT_API_KEY:            ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID:         ${{ secrets.YT_CHANNEL_ID }}
          YOUTUBE_PLAYLIST_IDS:  ${{ secrets.YOUTUBE_PLAYLIST_IDS }}
          FALLBACK_NATURE_LIST:  ${{ secrets.FALLBACK_NATURE_LIST }}
        run: |
          set -euo pipefail
          python world_en/world_weekly_collect.py
          echo "---- ls world_en"; ls -l world_en || true
          echo "---- head weekly.json"; head -c 600 world_en/weekly.json || true

      - name: Ensure weekly.json exists
        run: test -f world_en/weekly.json || { echo "weekly.json missing"; exit 1; }

      - name: Render message
        run: python world_en/render.py world_en/templates/weekly_en.j2 world_en/weekly.json > world_en/weekly_msg.txt

      - name: Build copy-ready YouTube Community text
        run: |
          python - <<'PY'
          import html
          import pathlib
          import re

          source = pathlib.Path('world_en/weekly_msg.txt').read_text(encoding='utf-8')
          plain = re.sub(r'<[^>]+>', '', source)
          plain = html.unescape(plain)
          plain = re.sub(r'[ \t]+\n', '\n', plain)
          plain = re.sub(r'\n{3,}', '\n\n', plain).strip()
          lines = plain.splitlines()
          while lines and not lines[-1].strip():
              lines.pop()
          if lines and re.match(r'^Follow daily on Telegram\b', lines[-1].strip(), flags=re.I):
              lines.pop()
          output = '\n'.join(lines).strip() + '\n'
          pathlib.Path('world_en/weekly_youtube.txt').write_text(output, encoding='utf-8')
          PY

      - name: Upload weekly report artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-weekly-${{ github.run_number }}
          path: |
            world_en/weekly.json
            world_en/weekly_msg.txt
            world_en/weekly_youtube.txt
          if-no-files-found: error
          retention-days: 30

      # ===================== TELEGRAM (MAIN) =====================
      - name: Send text (MAIN TG)
        if: ${{ github.event_name == 'schedule'
                || inputs.publish_to == 'telegram'
                || (inputs.publish_to == '' && inputs.send_to_test != true) }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_EN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID_EN }}
        run: |
          set -euo pipefail
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d parse_mode="HTML" \
            --data-urlencode text@"world_en/weekly_msg.txt"

      - name: Send Nature card (MAIN TG)
        if: ${{ github.event_name == 'schedule'
                || inputs.publish_to == 'telegram'
                || (inputs.publish_to == '' && inputs.send_to_test != true) }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_EN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID_EN }}
        run: |
          set -euo pipefail
          readarray -t L < <(python - <<'PY'
          import json
          d=json.load(open('world_en/weekly.json',encoding='utf-8'))
          print(d.get('TOP_NATURE_THUMB',''))
          print(d.get('TOP_NATURE_URL',''))
          title=d.get('TOP_NATURE_TITLE','Nature Break')
          snip =d.get('TOP_NATURE_SNIPPET','Short calm from Miss Relax')
          print(f"🌊 <b>{title}</b>\n<i>{snip}</i>")
          PY
          )
          THUMB="${L[0]}"; URL="${L[1]}"; CAPTION="${L[*]:2}"
          if [ -n "$THUMB" ] && [ -n "$URL" ]; then
            curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendPhoto" \
              -F chat_id="${TG_CHAT}" \
              -F photo="${THUMB}" \
              -F parse_mode="HTML" \
              -F caption="$CAPTION" \
              -F reply_markup='{"inline_keyboard":[[{"text":"▶️ Watch on YouTube","url":"'"$URL"'"}]]}'
          elif [ -n "$URL" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="$URL" \
              -d disable_web_page_preview=false
          else
            echo "No weekly TOP_NATURE_URL — skipping TG card."
          fi

      # ===================== TELEGRAM (TEST) =====================
      - name: Send text (TEST TG)
        if: ${{ inputs.publish_to == 'test'
                || (inputs.publish_to == '' && inputs.send_to_test == true) }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN_TEST }}
          TG_CHAT:  ${{ secrets.CHANNEL_ID_TEST }}
        run: |
          set -euo pipefail
          if [ -z "${TG_CHAT}" ]; then echo "TEST chat id is empty"; exit 1; fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d parse_mode="HTML" \
            --data-urlencode text@"world_en/weekly_msg.txt"

      - name: Send Nature card (TEST TG)
        if: ${{ inputs.publish_to == 'test'
                || (inputs.publish_to == '' && inputs.send_to_test == true) }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN_TEST }}
          TG_CHAT:  ${{ secrets.CHANNEL_ID_TEST }}
        run: |
          set -euo pipefail
          readarray -t L < <(python - <<'PY'
          import json
          d=json.load(open('world_en/weekly.json',encoding='utf-8'))
          print(d.get('TOP_NATURE_THUMB',''))
          print(d.get('TOP_NATURE_URL',''))
          title=d.get('TOP_NATURE_TITLE','Nature Break')
          snip =d.get('TOP_NATURE_SNIPPET','Short calm from Miss Relax')
          print(f"🌊 <b>{title}</b>\n<i>{snip}</i>")
          PY
          )
          THUMB="${L[0]}"; URL="${L[1]}"; CAPTION="${L[*]:2}"
          if [ -z "${TG_CHAT}" ]; then echo "TEST chat id is empty"; exit 1; fi
          if [ -n "$THUMB" ] && [ -n "$URL" ]; then
            curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendPhoto" \
              -F chat_id="${TG_CHAT}" \
              -F photo="${THUMB}" \
              -F parse_mode="HTML" \
              -F caption="$CAPTION" \
              -F reply_markup='{"inline_keyboard":[[{"text":"▶️ Watch on YouTube","url":"'"$URL"'"}]]}'
          elif [ -n "$URL" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="$URL" \
              -d disable_web_page_preview=false
          else
            echo "No weekly TOP_NATURE_URL — skipping TG test card."
          fi
